name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform's failure must not cancel the others, so a run reports
      # every platform's state rather than only the first to break.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            script: build:mac:arm64
          - os: macos-15-intel
            arch: x64
            script: build:mac:x64
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # macOS signs with the Developer ID certificate in MAC_CSC_LINK, then
      # notarises with the Apple ID credentials. CSC_LINK is read on every
      # platform, so it must stay off the Windows and Linux runners.
      - name: Build application (signed and notarised)
        if: runner.os == 'macOS'
        run: npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build application
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload ONLY the distributable installer-ish artifacts for each OS.
      # (We do not upload the entire app bundle contents.)
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch || 'default' }}-dist
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
          if-no-files-found: warn

      # Every job uploads its own manifest. The two macOS manifests each list
      # one arch, so the release job merges them before publishing.
      - name: Upload update manifests
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch || 'default' }}-manifests
          path: dist/latest*.yml
          if-no-files-found: warn

  build-extension:
    runs-on: macos-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # build:ext (webview + esbuilt host) then extensions-cli package → .ablx.
      # extensions-cli is the vendored @ableton-extensions/cli devDependency, so
      # it resolves on the npm-script PATH without a global install.
      - name: Build Ableton extension
        run: npm run ext:package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ableton-extension
          path: out-ext/noise-canvas.ablx
          if-no-files-found: error

  release:
    needs: [build, build-extension]
    # workflow_dispatch is the dry run: it builds, signs and notarises, and the
    # artifacts land on the run page, but only a tag publishes a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # This lets us create a Release and upload assets.
    permissions:
      contents: write

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          # release-notes.sh walks back to the previous tag.
          fetch-depth: 0

      - name: Build release notes from commit titles
        run: bash scripts/release-notes.sh "${{ github.ref_name }}" | tee release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # electron-builder writes one latest-mac.yml per arch, each listing only
      # its own build. electron-updater filters that list by arch, so an
      # arm64-only manifest leaves Intel Macs with nothing to download.
      - name: Merge macOS update manifests
        run: |
          mkdir -p /tmp/merge && cd /tmp/merge
          npm init -y > /dev/null
          npm install js-yaml@4 > /dev/null
          cp "$GITHUB_WORKSPACE/scripts/merge-mac-manifests.mjs" .
          node merge-mac-manifests.mjs \
            "$GITHUB_WORKSPACE/artifacts" \
            "$GITHUB_WORKSPACE/artifacts/merged/latest-mac.yml"

      # Create/publish the GitHub Release from the tag, attach installers.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          # electron-updater reads this body back out of the releases Atom feed
          # and shows it as "What's New" in the update prompt.
          body_path: release-notes.md
          generate_release_notes: false
          # discussion_category_name: Announcements

          # Avoid failing if e.g. Linux didn't build .deb, etc.
          fail_on_unmatched_files: false

          # Only attach installer files + update manifests, not raw bundle internals.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*-setup.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.ablx
            artifacts/**/*.blockmap
            artifacts/merged/latest-mac.yml
            artifacts/**/*-manifests/latest.yml
            artifacts/**/*-manifests/latest-linux.yml
