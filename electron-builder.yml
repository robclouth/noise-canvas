appId: com.robclouth.noise-canvas
productName: "Noise Canvas"
directories:
  buildResources: build
files:
  - out/**
  - package.json
  # strip cruft everywhere (incl. node_modules)
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.md"
  - "!**/README*"
  - "!**/CHANGELOG*"
  - "!**/docs{,/**}"
  - "!**/test{,/**}"
  - "!**/tests{,/**}"
  - "!**/example{,/**}"
  - "!**/examples{,/**}"
  - "!**/demo{,/**}"
  - "!node_modules/**/{benchmark,benchmarks}"
  - "build/Release/gaborator_addon.node"
  - "build/Release/link_addon.node"
  # ONNX Runtime, beside the addon that loads it. Only one of these exists per
  # platform, and Intel macOS has none.
  - "build/Release/libonnxruntime.1.24.3.dylib"
  - "build/Release/libonnxruntime.so.1"
  - "build/Release/onnxruntime.dll"

extraResources:
  - from: resources/hrtf
    to: hrtf
    filter:
      - "**/*"
      - "!cache${/*}"
  - from: resources/samples
    to: samples
    filter:
      - "**/*"
asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.dylib"
  - "**/*.dll"
  - "**/*.so.*"
  - "**/node_modules/ffmpeg-static/ffmpeg*"
win:
  icon: resources/icon.png
  executableName: "Noise Canvas"
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: resources/icon.png
  artifactName: ${name}-${version}-${arch}.${ext}
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Noise Canvas needs the microphone to record audio into a canvas.
    NSDocumentsFolderUsageDescription: Noise Canvas needs your Documents folder to open and save audio files there.
    NSDownloadsFolderUsageDescription: Noise Canvas needs your Downloads folder to open and save audio files there.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  icon: resources/icon.png
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
publish:
  provider: github
  owner: robclouth
  repo: noise-canvas
npmRebuild: false
